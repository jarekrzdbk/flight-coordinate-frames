<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Flight coordinate frames</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <main id="main">
            <section id="view" aria-label="Interactive 3D orientation">
                <div id="formula"></div>
                <div class="orbit-hint">Drag to orbit · wheel to zoom</div>
            </section>

            <section id="projection-panel" aria-label="Fixed 2D projection">
                <canvas id="combined"></canvas>
            </section>
        </main>

        <aside id="side">
            <h1>Flight coordinate frames</h1>
            <p id="frame-description" class="subhead"></p>

            <fieldset>
                <legend>Display</legend>
                <div class="control select-control">
                    <label for="frame-mode">Reference</label>
                    <select id="frame-mode">
                        <option value="ground">Normal ground · Y up</option>
                        <option value="ned">NED navigation · Z down</option>
                    </select>
                </div>
                <div class="control select-control">
                    <label for="transformation">Transform</label>
                    <select id="transformation">
                        <option value="attitude">Normal CS → body CS</option>
                        <option value="trajectory">Normal CS → trajectory CS</option>
                        <option value="airDirection">Normal CS → air CS 1a</option>
                        <option value="airBank">Air CS 1a → velocity CS a</option>
                        <option value="airVelocity">Normal CS → velocity CS a (via 1a)</option>
                        <option value="airBody">Velocity CS a → body CS</option>
                    </select>
                </div>
                <div class="control select-control">
                    <label for="sequence-mode">Method</label>
                    <select id="sequence-mode">
                        <option value="krylov">Krylov · three axes</option>
                        <option value="euler">Classical Euler</option>
                        <option value="trajectory" disabled hidden>Ψ, Θ</option>
                        <option value="airDirection" disabled hidden>ψₐ, ϑₐ</option>
                        <option value="airBank" disabled hidden>γₐ</option>
                        <option value="airVelocity" disabled hidden>ψₐ, ϑₐ, γₐ</option>
                        <option value="airBody" disabled hidden>β, α</option>
                    </select>
                </div>
                <div class="control select-control">
                    <label for="label-mode">Labels</label>
                    <select id="label-mode">
                        <option value="xyz">X, Y, Z</option>
                        <option value="numbered">1–2–3 / S–T–K–P</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Angles</legend>

                <div class="control">
                    <label id="yaw-label" for="yaw">&psi; yaw</label>
                    <input id="yaw" type="range" min="-180" max="180" value="30">
                    <output id="yaw-value">30°</output>
                </div>

                <div class="control">
                    <label id="pitch-label" for="pitch">&#x03D1; pitch</label>
                    <input id="pitch" type="range" min="-90" max="90" value="20">
                    <output id="pitch-value">20°</output>
                </div>

                <div class="control">
                    <label id="roll-label" for="roll">&phi; roll</label>
                    <input id="roll" type="range" min="-180" max="180" value="25">
                    <output id="roll-value">25°</output>
                </div>

                <small id="angle-note"></small>
            </fieldset>

            <fieldset>
                <legend>Sequence position</legend>

                <div class="steps">
                    <button id="previous" type="button" aria-label="Previous rotation">←</button>
                    <output id="stage-label">X/Y/Z · final</output>
                    <button id="next" type="button" aria-label="Next rotation">→</button>
                </div>

                <small id="sequence-text"></small>

                <button id="animate" type="button">Animate Xg/Yg/Zg → X/Y/Z</button>
                <button id="reset" type="button">Reset values and view</button>
            </fieldset>

            <fieldset>
                <legend>Legend</legend>

                <p>
                <span class="swatch x"></span>X
                <span class="swatch y"></span>Y
                <span class="swatch z"></span>Z current axes
                </p>

                <p>
                <span class="swatch initial"></span>source
                <span class="swatch intermediate"></span>intermediate
                </p>

                <p id="angle-legend">
                <span class="swatch yaw"></span>&psi;
                <span class="swatch pitch"></span>&#x03D1;
                <span class="swatch roll"></span>&phi;
                </p>

                <small id="label-note"></small>
            </fieldset>
        </aside>

        <script src="./lib/three.min.js"></script>
        <script src="./model.js"></script>
        <script src="./view.js"></script>
        <script src="./app.js"></script>
    </body>
</html>
